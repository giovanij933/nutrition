<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FUEL">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>ISIONXXX // FUEL</title>
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--card:#0c0c0c;--cell:#0a0a0a;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--mu:#78746a;--acc:#ffb000;--amber:#ffb000;
  --g:#33ff66;--r:#ff4545;--a:#ff7a33;--b:#7f9cb0;--blue:#ffb000;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(48px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
::selection{background:var(--acc);color:#000}
.red{color:var(--r)}.grn{color:var(--g)}.amb{color:var(--acc)}.mu{color:var(--mu)}.mu2{color:var(--mu)}
.hidden{display:none!important}

/* header + filter bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--acc);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .btn svg{display:none}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0}
.sel{background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;min-width:150px}
.sel:hover{border-color:var(--acc);color:var(--acc)}
.ctx{color:var(--mu)}
.sp{flex:1}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:0;padding:7px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn svg{width:14px;height:14px}
.btn.pri,.btn.go{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.btn.pri:hover,.btn.go:hover{color:#000;filter:brightness(1.12)}
.btn.dng{color:var(--r)}.btn.dng:hover{border-color:var(--r)}

/* layout + cards */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.gm{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ban{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px;margin-bottom:12px;flex-wrap:wrap;border-color:var(--acc)}
.bd{padding:16px;flex:1;display:flex;flex-direction:column}
.ft{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;font-size:11px;color:var(--mu);gap:10px;flex-wrap:wrap;align-items:center}
.card h3{font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.card h3::before{content:'> ';color:var(--mu)}
.lbl{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge text{font-weight:600}
.lr{display:flex;align-items:center;padding:2px 0}
.lr span{flex:1}.lr b{min-width:24px;text-align:right}.lr em{font-style:normal;width:48px;text-align:right;color:var(--mu)}
.dot{width:7px;height:7px;margin-right:7px;display:inline-block;flex:none}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.hb{height:20px;background:#111;margin:2px 0 10px;overflow:hidden}
.hb i{display:block;height:100%}

/* rotation plan */
.pdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pday{background:var(--cell);border:1px solid var(--line);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pday.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.pdn{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.pp{border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:3px 6px;font-size:10px;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pst{font-size:10px;min-height:12px;display:flex;gap:3px;align-items:center}.pst i{width:7px;height:7px;display:inline-block}

/* calendar */
.calhd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wl{color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:12px}
.dh{text-align:center;font-size:11px;color:var(--mu);padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cell{min-height:66px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--mu);cursor:pointer;position:relative;overflow:hidden}
.cell.hatch{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cell.out{cursor:default;border-color:transparent;opacity:.5}
.cell.fut span{color:#3a3a3a}
.cell.on{border-color:rgba(255,176,0,.3)}
.cell.on b{font-size:12px;color:var(--tx)}
.cell.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cell small{font-size:10px;color:var(--mu)}
.cell.wk{border:1px dashed var(--line2);background:#0a0a0a;color:var(--mu);cursor:default}
.cell.wk b{font-size:11px}
.cdots{display:flex;gap:2px}.cdots i{width:5px;height:5px}
.calft{padding:10px 16px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line2);min-width:24px;height:24px;padding:0 6px;font-size:12px}
.nav button:hover{border-color:var(--acc);color:var(--acc)}
.nav .tb{font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* coverage */
.ev h4{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;font-weight:400;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.ev h4:first-of-type{border:0;padding-top:0;margin-top:0}
.er{display:flex;align-items:center;padding:5px 0;gap:2px}
.er span{flex:1}.er b{margin-right:8px;text-align:right;font-weight:600}
.q{width:12px;height:12px;border:1px solid var(--line2);font-size:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);font-style:normal;flex:none;cursor:help}
hr{border:0;border-top:1px solid var(--line);margin:4px 0 8px}

/* charts */
.chart{width:100%;height:160px;display:block;margin-top:8px}
.chart *{vector-effect:non-scaling-stroke}
.empty{height:160px;display:grid;place-items:center;color:var(--mu);letter-spacing:.14em;font-size:11px;text-transform:uppercase;text-align:center}
.eqh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ks{display:flex;gap:22px;flex-wrap:wrap}
.ks div{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.ks b{font-size:13px;color:var(--tx);letter-spacing:0;text-transform:none}
.radar{width:100%;max-width:230px;height:auto;margin:0 auto;display:block}
svg text{font-family:var(--f)}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.num{text-align:right}
.pill{display:inline-flex;padding:1px 6px;font-size:10px;border:1px solid;letter-spacing:.06em;text-transform:uppercase}
.acts{display:flex;gap:4px;justify-content:flex-end}
td .acts button{width:24px;height:24px;border:1px solid var(--line2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center}
td .acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts svg{width:13px;height:13px}
.th{display:flex;align-items:center;gap:12px;padding:16px 16px 4px}
.th h3{margin:0;flex:1}
.tf{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:var(--mu);gap:10px;flex-wrap:wrap}
.pg{display:flex;align-items:center;gap:6px}
.pg button{border:1px solid var(--line2);min-width:24px;height:24px}
.pg button:hover{border-color:var(--acc);color:var(--acc)}
.pg input{width:40px;text-align:center;background:var(--bg);border:1px solid var(--line2);padding:3px}
.rs{background:var(--bg);border:1px solid var(--line2);padding:3px 6px}

/* modal (matches the dialogs in MIND / TRAINING) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.box{background:var(--card);border:1px solid var(--acc);padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.box.wide{max-width:760px}
.box h3{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.box p{margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--line2);padding:7px 10px;width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc);outline:0}
.ck{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--tx)}
.fg .ck label,.ck label{flex-direction:row;align-items:center;gap:6px;color:var(--tx);text-transform:none;letter-spacing:0;font-size:12px}
.ck input{width:auto;accent-color:var(--acc)}
.full{grid-column:1/-1}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.kv span{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;background:var(--card);border:1px solid var(--acc);color:var(--acc);padding:8px 14px;z-index:30}

/* cook mode */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}
.step{display:flex;align-items:center;gap:8px}.step button{width:30px;height:30px;border:1px solid var(--line2);font-size:15px}.step button:hover{border-color:var(--acc);color:var(--acc)}.step b{font-size:18px;min-width:26px;text-align:center}
.ckh{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.ckh h3{margin:0}
.sec{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;margin:12px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.ing{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.ing label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.ing input{accent-color:var(--g);margin-top:3px}
.ing input:checked+span{color:var(--mu);text-decoration:line-through}
.stp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.5}
.stp>b{width:22px;height:22px;border:1px solid var(--acc);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px}
.stp>div{flex:1}
.tmr{border:1px solid var(--line2);padding:3px 8px;font-size:11px;white-space:nowrap;align-self:flex-start;letter-spacing:.06em}
.tmr:hover{border-color:var(--acc);color:var(--acc)}
.ns{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;background:var(--bg);border:1px solid var(--line);padding:10px 12px}.ns b{color:var(--tx);display:block;font-size:13px;letter-spacing:0;text-transform:none}
.tip{color:var(--mu);border:1px solid var(--line);border-left:2px solid var(--acc);padding:10px 12px;margin-top:14px;line-height:1.5}
pre.gl{white-space:pre-wrap;font:12px/1.6 var(--f);background:var(--bg);border:1px solid var(--line);padding:12px;margin-top:12px}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.gm,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fg,.ing{grid-template-columns:1fr}
  .sel{min-width:0;flex:1}.ctx{width:100%}
  .cell{min-height:50px;padding:3px}.cell small{display:none}.cell b{font-size:10px}
  .pdays{grid-template-columns:repeat(4,1fr)}
  .fg input,.fg select,.fg textarea{font-size:16px}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">ISIONXXX <b>//</b> FUEL<i class="cur"></i></div>
  <div class="acts" id="barBtns"></div>
</header>
<div class="bar">
  <select id="fKind" class="sel"><option value="all">All meals</option><option value="bowl">Bowls only</option><option value="quick">Other foods</option></select>
  <select id="fRange" class="sel">
    <option value="today">Today</option><option value="week">This week</option><option value="7d">Last 7 days</option>
    <option value="30d">Last 30 days</option><option value="90d">Last 90 days</option><option value="all">All time</option>
  </select>
  <span id="ctx" class="ctx"></span>
</div>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="box" id="mbox"></div></div>

<script>
const $=s=>document.querySelector(s);
const ACC='var(--acc,#ffb000)';                       // brand amber (measurement)
/* ---------- nutrition data (approx. USDA FoodData Central values) ---------- */
const FD={
  rice_dry:{kcal:675,p:13.2,c:148,f:1.2,fib:2.4,na:9,k:213,ca:52,fe:4.4,mg:46,fol:350,zn:2},          // per cup uncooked, enriched white
  rice_ckd:{kcal:205,p:4.3,c:44.5,f:.4,fib:.6,na:2,k:55,ca:16,fe:1.9,mg:19,fol:92,zn:.8},             // per cup cooked
  beans:{kcal:227,p:15.2,c:40.8,f:.9,fib:15,na:250,k:611,ca:46,fe:3.6,mg:120,fol:256,zn:1.9,ala:.18}, // per cup, canned rinsed
  egg:{kcal:72,p:6.3,c:.4,f:4.8,na:71,k:69,ca:28,fe:.9,mg:6,fol:24,vd:1.1,vk:.15,b12:.45,zn:.65,ala:.02,epa:.03},
  avocado:{kcal:227,p:2.7,c:11.8,f:21,fib:9.2,na:11,k:690,ca:18,fe:.8,mg:39,fol:121,vc:12,vk:28.6,zn:.9,ala:.15},
  spinach:{kcal:7,p:.86,c:1.1,f:.1,fib:.7,na:24,k:167,ca:30,fe:.81,mg:24,fol:58,vc:8.4,vk:145,zn:.16,ala:.04},
  tomato:{kcal:22,p:1.1,c:4.8,f:.25,fib:1.5,na:6,k:292,ca:12,fe:.33,mg:13.5,fol:18,vc:17,vk:9.7,zn:.2},
  flax:{kcal:37,p:1.3,c:2,f:2.95,fib:1.9,na:2,k:57,ca:18,fe:.4,mg:27,fol:6,zn:.3,ala:1.6},
  chia:{kcal:58,p:2,c:5,f:3.7,fib:4.1,na:2,k:49,ca:76,fe:.9,mg:40,fol:6,zn:.55,ala:2.1},
  oil:{kcal:40,f:4.5,vk:2.7,ala:.03},
  garlic:{kcal:4.5,p:.2,c:1,k:12,ca:5,vc:.9},
  lime:{kcal:11,c:3.7,k:51,vc:13},
  salt:{na:2325},
  pepper:{kcal:6,c:1.5,fib:.6,fe:.22,vk:3.8},
  salmon:{kcal:58,p:6.3,f:3.5,na:17,k:109,ca:4,fe:.1,mg:8.5,fol:9.6,vd:3.7,b12:.79,zn:.12,epa:.61},     // per oz cooked
  sardines:{kcal:191,p:22.7,f:10.5,na:282,k:365,ca:351,fe:2.7,mg:36,fol:11,vd:4.4,vk:2.4,b12:8.2,zn:1.2,epa:.9}, // per 3.75 oz can
  chicken:{kcal:46.8,p:8.8,f:1,na:21,k:73,ca:4,fe:.3,mg:8,fol:1,b12:.1,zn:.28,epa:.01},              // per oz cooked breast
  steak:{kcal:55,p:8.3,f:2.2,na:16,k:100,ca:5,fe:.58,mg:7.5,fol:3,b12:.45,zn:1.45,vd:.03},            // per oz cooked lean sirloin
  milk_whole:{kcal:149,p:7.7,c:11.7,f:7.9,na:105,k:322,ca:276,fe:.07,mg:24,fol:12,vd:3.2,b12:1.1,zn:.9},
  milk_2:{kcal:122,p:8.1,c:11.7,f:4.8,na:115,k:342,ca:293,fe:.07,mg:27,fol:12,vd:2.9,b12:1.3,zn:1.2},
  milk_skim:{kcal:83,p:8.3,c:12.2,f:.2,na:103,k:382,ca:299,fe:.07,mg:27,fol:12,vd:2.9,b12:1.2,zn:1}};
// recipe as written = 3 servings
const BASE=[['rice',1.5,'cup'],['beans',2.25,'cup'],['avocado',3,''],['spinach',4.5,'cup'],['tomato',3,''],['seed',3,'tbsp'],['oil',3,'tsp'],['garlic',3,'clove'],['lime',1.5,''],['salt',.75,'tsp'],['pepper',.375,'tsp']];
const OMIT=[['rice','Rice'],['beans','Beans'],['avocado','Avocado'],['spinach','Spinach'],['tomato','Tomato'],['seed','Seeds'],['oil','Olive oil']];
const PROT={egg:{n:'Eggs',col:'#ffb000',fish:0},salmon:{n:'Salmon',col:'#e0607e',fish:1},sardines:{n:'Sardines',col:'#4fb3a9',fish:1},chicken:{n:'Chicken',col:'#c8b38a',fish:0},steak:{n:'Steak',col:'#9c8aa5',fish:0}};
const PKEYS=Object.keys(PROT);
const NUT=[ // key,label,unit,DV,limit?
  ['fib','Fiber','g',28],['na','Sodium','mg',2300,1],['k','Potassium','mg',4700],['ca','Calcium','mg',1300],['fe','Iron','mg',18],['mg','Magnesium','mg',420],['zn','Zinc','mg',11],
  ['fol','Folate','mcg',400],['vc','Vitamin C','mg',90],['vd','Vitamin D','mcg',20],['vk','Vitamin K','mcg',120],['b12','Vitamin B12','mcg',2.4],['ala','ALA omega-3','g',1.6]];
const EPA_WK=3.5; // g EPA+DHA per week (~500 mg/day)

/* ---------- storage ---------- */
const K={m:'nj.meals.v1',s:'nj.settings.v1'};
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const save=()=>{localStorage.setItem(K.m,JSON.stringify(meals));localStorage.setItem(K.s,JSON.stringify(settings))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let meals=load(K.m,[]);if(!Array.isArray(meals))meals=[];
let settings=Object.assign({kcal:2000,protein:100,riceAs:'dry',seed:'flax',milk:'whole',portion:4.5,fishTarget:2,
  plan:['egg','salmon','egg','chicken','sardines','steak','egg'],batch:null},load(K.s,{}));

/* ---------- helpers ---------- */
const r1=v=>Math.round(v*10)/10;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((pd(b)-pd(a))/864e5);

function fq(v){const w=Math.floor(v+1e-9),fr=v-w;let b=FR[0];FR.forEach(x=>{if(Math.abs(x[0]-fr)<Math.abs(b[0]-fr))b=x});const W=w+(b[0]===1?1:0);return(W?String(W):'')+(b[1]?(W?' ':'')+b[1]:'')||'0'}

/* ---------- nutrition math ---------- */
const fk=k=>k==='rice'?(settings.riceAs==='cooked'?'rice_ckd':'rice_dry'):k==='seed'?settings.seed:k;
const protParts=(p,s)=>p==='egg'?[['egg',2*s]]:p==='sardines'?[['sardines',s]]:[[p,settings.portion*s]];
function parts(m){
  const s=m.servings||1,o=new Set(m.omit||[]),out=[];
  BASE.forEach(([k,q])=>{if(!o.has(k))out.push(['base',fk(k),q/3*s])});
  protParts(m.protein||'egg',s).forEach(x=>out.push(['prot',...x]));
  if(m.milk)out.push(['milk','milk_'+settings.milk,1]);
  return out;
}
function nutMeal(m){
  const t={},src={base:{},prot:{},milk:{},quick:{}};
  if(m.kind==='quick'){['kcal','p','c','f','fib'].forEach(k=>{const v=+m[k]||0;t[k]=v;src.quick[k]=v});return{t,src}}
  parts(m).forEach(([tag,key,q])=>{const d=FD[key];for(const k in d){t[k]=(t[k]||0)+d[k]*q;src[tag][k]=(src[tag][k]||0)+d[k]*q}});
  return{t,src};
}
const NMC=new Map(),NM=m=>{let v=NMC.get(m.id);if(!v){v=nutMeal(m);NMC.set(m.id,v)}return v};

/* ---------- state & filters ---------- */
const S={kind:'all',range:'7d',sel:null,month:null,page:1,rows:20};
{const t=new Date();S.month=new Date(t.getFullYear(),t.getMonth(),1)}
const RL={today:'Today',week:'This week','7d':'Last 7 days','30d':'Last 30 days','90d':'Last 90 days',all:'All time'};
const kindOk=m=>S.kind==='all'||m.kind===S.kind;
function range(){
  if(S.sel)return[S.sel,S.sel];
  const t=today();
  switch(S.range){
    case'today':return[t,t];case'week':return[monday(t),t];case'7d':return[addDays(t,-6),t];
    case'30d':return[addDays(t,-29),t];case'90d':return[addDays(t,-89),t];default:return['0000-00-00','9999-99-99'];
  }
}
function filtered(){const[a,b]=range();return meals.filter(m=>{const d=dayOf(m);return kindOk(m)&&d>=a&&d<=b})}

/* ---------- stats ---------- */
function stats(ms,rg){
  const a=[...ms].sort((x,y)=>new Date(x.time)-new Date(y.time)),dm={},T={},SRC={base:{},prot:{},milk:{},quick:{}},rot={};PKEYS.forEach(p=>rot[p]=0);
  let bowls=0,fish=0,milk=0;
  a.forEach(m=>{const{t,src}=NM(m),d=dayOf(m),o=(dm[d]??={t:{},n:0});add(o.t,t);o.n++;add(T,t);for(const k in src)add(SRC[k],src[k]);
    if(m.kind==='bowl'){bowls+=m.servings||1;rot[m.protein]++;if(PROT[m.protein]?.fish)fish++;if(m.milk)milk++}});
  const ds=Object.keys(dm).sort().map(d=>({d,...dm[d]})),D=ds.length;
  let from=rg[0],to=rg[1];if(from==='0000-00-00'){from=ds[0]?.d||today();to=today()}
  const end=rg[1]==='9999-99-99'?today():rg[1];let epa7=0,fish7=0;
  meals.forEach(m=>{const d=dayOf(m);if(d<=end&&d>addDays(end,-7)){epa7+=NM(m).t.epa||0;if(m.kind==='bowl'&&PROT[m.protein]?.fish)fish7++}});
  const wk=[],m0=monday(end);
  for(let i=7;i>=0;i--){const ws=addDays(m0,-7*i),we=addDays(ws,6);let s=0;meals.forEach(m=>{const d=dayOf(m);if(d>=ws&&d<=we)s+=NM(m).t.epa||0});wk.push({ws,s})}
  const av=k=>D?(T[k]||0)/D:0,avS=(tag,k)=>D?(SRC[tag][k]||0)/D:0;
  const pk=av('p')*4,ck=av('c')*4,fk2=av('f')*9,mk=pk+ck+fk2;
  return{a,D,ds,T,from,to,av,avS,bowls,fish,milk,rot,epa7,fish7,wk,mac:{p:mk?pk/mk:0,c:mk?ck/mk:0,f:mk?fk2/mk:0}};
}

/* ---------- svg charts ---------- */
function gauge(segs,text){
  const cx=100,cy=92,r=72,id='g'+uid();
  const P=f=>{const a=Math.PI*(1-f);return(cx+r*Math.cos(a)).toFixed(2)+' '+(cy-r*Math.sin(a)).toFixed(2)};
  const arc=(a,b)=>`M${P(a)}A${r} ${r} 0 0 1 ${P(b)}`;
  const col={g:'#ffb000',r:'#ff4545',a:'#ff7a33',b:'#7f9cb0',n:'#78746a',v:'#33ff66'};
  let s=0,p='';
  for(const[f,c]of segs){if(!(f>0))continue;const e=Math.min(1,s+f);p+=`<path d="${arc(s,e)}" stroke="${col[c]}" stroke-width="12" fill="none"/>`;s=e}
  return`<svg class="gauge" viewBox="0 0 200 104">
    <path d="${arc(0,1)}" stroke="#2c2c2c" stroke-width="12" fill="none"/>${p}
    <text x="100" y="${cy-2}" text-anchor="middle" font-size="22" font-weight="600" fill="#d9d5c8">${text}</text></svg>`;
}
// fill = progress toward target (amber); over target shows orange overflow
const tgtGauge=(v,t)=>{const f=t?v/t:0;return gauge(f<=1?[[f,'g']]:[[1/f,'g'],[1-1/f,'a']],Math.round(f*100)+'%')};
function smooth(pts){
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d;
}
function area(series,color,tgt){
  if(series.length<2)return'<div class="empty">Not enough data yet</div>';
  const W=800,H=200,p=12,mx=Math.max(1,...series,(tgt||0)*1.1),X=i=>p+i*(W-2*p)/(series.length-1),Y=v=>p+(mx-v)/mx*(H-2*p);
  const d=smooth(series.map((v,i)=>[X(i),Y(v)])),id='a'+uid();
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${d} L${X(series.length-1)},${Y(0)} L${X(0)},${Y(0)} Z" fill="${color}" fill-opacity=".1"/>
    ${tgt?`<line x1="${p}" x2="${W-p}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="#2c2c2c" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>`:''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function bars(vals,{labels,tgt}={}){
  if(!vals.length||!Math.max(...vals))return'<div class="empty">No data in range</div>';
  const W=400,H=200,p=labels?28:16,mx=Math.max(1,...vals,(tgt||0)*1.1),n=vals.length,slot=(W-20)/n,bw=Math.min(slot*.7,300),id='b'+uid(),Y=v=>H-p-v/mx*(H-p-12);
  const rects=vals.map((v,i)=>{const x=10+i*slot+(slot-bw)/2,y=Y(v);
    return`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,H-p-y).toFixed(1)}" fill="#ffb000"/>${labels?`<text x="${(x+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#78746a">${labels[i]}</text>`:''}`}).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" ${labels?'':'preserveAspectRatio="none"'}>${rects}
    ${tgt?`<line x1="6" x2="${W-6}" y1="${Y(tgt).toFixed(1)}" y2="${Y(tgt).toFixed(1)}" stroke="#78746a" stroke-dasharray="4 4" ${labels?'':'vector-effect="non-scaling-stroke"'}/>`:''}</svg>`;
}
function radar(labels,raw){
  const n=labels.length,cx=150,cy=122,R=76,A=labels.map((_,i)=>(-90+i*360/n)*Math.PI/180),mx=Math.max(...raw)||1;
  const pt=(i,v)=>[cx+R*v*Math.cos(A[i]),cy+R*v*Math.sin(A[i])];
  const poly=f=>A.map((_,i)=>pt(i,f(i)).map(x=>x.toFixed(1)).join(',')).join(' ');
  const lab=labels.map((l,i)=>{const[x,y]=pt(i,1.2),c=Math.cos(A[i]);return`<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${Math.abs(c)<.2?'middle':c>0?'start':'end'}">${l}</text>`}).join('');
  return`<svg class="radar" viewBox="0 0 300 240" font-size="10" letter-spacing=".08em" fill="#78746a">
    ${[1,.75,.5,.25].map(v=>`<polygon points="${poly(()=>v)}" fill="none" stroke="#2c2c2c"/>`).join('')}
    ${A.map((_,i)=>{const[x,y]=pt(i,1);return`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#2c2c2c"/>`}).join('')}
    <polygon points="${poly(i=>Math.max(.04,raw[i]/mx))}"  fill="#ffb000" fill-opacity=".16" stroke="#ffb000" stroke-width="1.5"/>${lab}</svg>`;
}

  const row=([k,l,u,dv,lim])=>{const v=st.av(k),p=Math.round(v/dv*100),c=st.D?covCls(p,lim):'';
    return er(CV[c],l,st.D?`${fnum(r1(v))} ${u} · <span class="${c}">${p}%</span>`:'—',lim?`Limit: ${dv} ${u}/day`:`Daily value: ${dv} ${u}`)};
  const grp=keys=>NUT.filter(n=>keys.includes(n[0])).map(row).join('');
  const e=st.epa7,ec=e>=EPA_WK?'grn':e>=EPA_WK/2?'amb':'red';
  return`<div class="card"><div class="bd ev"><h3>Nutrient coverage</h3><div class="lbl" style="margin-top:-12px">Avg per logged day vs daily value</div>
    <h4>MINERALS</h4>${grp(['k','ca','fe','mg','zn','na'])}
    <hr><h4>VITAMINS</h4>${grp(['fol','vc','vd','vk','b12'])}
    <hr><h4>FIBER &amp; FATS</h4>${grp(['fib','ala'])}
    ${er(CV[ec],'EPA + DHA (7 days)',`${fnum(r1(e))} g · <span class="${ec}">${Math.round(e/EPA_WK*100)}%</span>`,`Target ~${EPA_WK} g/week (≈500 mg/day). Only fish provides meaningful amounts.`)}
  </div></div>`;
}

  const rows=f.slice((S.page-1)*S.rows,S.page*S.rows),tf=d=>new Date(d).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  return`<div class="th"><h3>Meal log</h3><button class="btn" data-act="export">${I.dl}Export CSV</button></div>
  <div class="tw"><table><thead><tr><th>Date (local)</th><th>Meal</th><th class="num">Servings</th><th class="num">kcal</th><th class="num">Protein</th><th class="num">Carbs</th><th class="num">Fat</th><th class="num">Fiber</th><th class="num">EPA+DHA</th><th class="num">Milk</th><th></th></tr></thead><tbody>
  ${rows.map(m=>{const t=NM(m).t,P=PROT[m.protein];return`<tr><td class="mu2">${tf(m.time)}</td>
    <td>${m.kind==='bowl'?`<b>Bowl</b> <span class="pill" style="color:${P.col};border-color:${P.col}55;background:${P.col}1a">${P.n}</span>${(m.omit||[]).length?` <span class="mu">− ${m.omit.join(', ')}</span>`:''}`:`<b>${esc(m.name)}</b>`}</td>
    <td class="num">${m.kind==='bowl'?fnum(m.servings||1):'—'}</td><td class="num">${fi(t.kcal)}</td><td class="num">${fi(t.p)} g</td><td class="num">${fi(t.c)} g</td><td class="num">${fi(t.f)} g</td><td class="num">${fi(t.fib)} g</td>
    <td class="num ${t.epa>=.5?'grn':''}">${t.epa?fi(t.epa*1000)+' mg':'—'}</td><td class="num">${m.milk?'<span class="grn">✓</span>':'—'}</td>
    <td><div class="acts"><button data-act="info" data-id="${m.id}" title="Nutrition">${I.info}</button><button data-act="edit" data-id="${m.id}" title="Edit">${I.note}</button></div></td></tr>`}).join('')
  ||'<tr><td colspan="11" style="text-align:center;color:#555;padding:30px">Nothing logged in this range</td></tr>'}
  </tbody></table></div>
  <div class="tf"><div class="pg"><button data-act="pprev">‹</button>Page <input id="pgIn" type="number" min="1" value="${S.page}"> of ${pages}<button data-act="pnext">›</button></div>
  <div class="pg"><select id="rowsSel" class="rs">${[10,20,50,100].map(n=>`<option value="${n}" ${n===S.rows?'selected':''}>${n} rows</option>`).join('')}</select><span style="margin-left:8px">${f.length} records</span></div></div>`;

function beep(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;[0,.35,.7].forEach(o=>{const s=AC.createOscillator(),g=AC.createGain();s.frequency.value=880;g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.2,t+o+.02);g.gain.exponentialRampToValueAtTime(.0001,t+o+.3);s.connect(g).connect(AC.destination);s.start(t+o);s.stop(t+o+.32)})}catch{}}
function cookMode(p){CK={s:1,protein:p||todayPlan(),milk:true};drawCook()}
function drawCook(){
  const s=CK.s,p=CK.protein,po=settings.portion,seedN=settings.seed==='chia'?'chia seeds':'ground flaxseed';
  const q=k=>{const b=BASE.find(x=>x[0]===k),v=b[1]/3*s;return fq(v)+(b[2]?' '+b[2]+(b[2]==='clove'&&v>1?'s':''):'')};
  const n=k=>BASE.find(x=>x[0]===k)[1]/3*s;
  const protIng={egg:`${2*s} large eggs`,salmon:`${fq(po*s)} oz salmon (cooked weight)`,sardines:`${s} can${s>1?'s':''} sardines (3.75 oz)`,chicken:`${fq(po*s)} oz chicken breast (cooked weight)`,steak:`${fq(po*s)} oz sirloin steak (cooked weight)`}[p];
  const rice=settings.riceAs==='cooked'?'cooked rice':'uncooked rice';
  const ings=[`${q('rice')} ${rice}`,`${q('beans')} black beans, drained &amp; rinsed`,protIng,`${q('avocado')} avocado${n('avocado')>1?'s':''}`,`${q('spinach')} fresh spinach`,
    `${q('tomato')} tomato${n('tomato')>1?'es':''}, diced`,`${q('seed')} ${seedN}`,`${q('oil')} olive oil`,`${q('garlic')} garlic, minced`,`${q('lime')} lime, juiced`,`${q('salt')} salt`,`${q('pepper')} black pepper`];
  if(CK.milk)ings.push(`${s} × 8 oz glass ${settings.milk==='2'?'2%':settings.milk} milk`);
  const protStep={egg:[`Cook ${2*s} large eggs to your preference — fried, scrambled, or soft-boiled (about 6½ min for jammy). Season with a pinch of salt and pepper.`,390],
    salmon:[`Season ${fq(po*s)} oz salmon. Cook skin-side down over medium-high 4–5 min, flip, 2–3 min more until it flakes (145°F inside).`,420],
    sardines:[`Drain ${s} can${s>1?'s':''} of sardines. Warm in the pan for a minute if you like, or serve as-is.`,0],
    chicken:[`Cook ${fq(po*s)} oz chicken breast over medium heat about 6 min per side until 165°F inside. Rest 3 min, slice.`,720],
    steak:[`Sear ${fq(po*s)} oz steak in a hot pan 3–4 min per side for medium-rare (130–135°F). Rest 5 min, slice against the grain.`,480]}[p];
  const steps=[
    [settings.riceAs==='cooked'?`Reheat ${q('rice')} cooked rice from your batch (add a splash of water, cover, microwave 1–2 min).`:`Rinse ${q('rice')} rice and cook according to package directions (usually 1:2 rice-to-water, simmered covered). Batch-cook extra at the start of the week.`,settings.riceAs==='cooked'?90:1080],
    [`In a small pot, heat ${q('beans')} black beans over medium with ${q('garlic')} garlic, ${q('salt')} salt and ${q('pepper')} pepper for 4–5 min until warmed through and fragrant.`,300],
    [`Heat ${q('oil')} olive oil over medium. Add ${q('spinach')} spinach and sauté 1–2 min until just wilted. Remove from heat.`,120],
    protStep,
    [`Slice ${q('avocado')} avocado and dice ${q('tomato')} tomato. Squeeze ${q('lime')} lime over them — the vitamin C boosts iron absorption from the beans and spinach.`,0],
    [`Layer rice, beans and spinach in ${s>1?'bowls':'a bowl'}. Top with the ${PROT[p].n.toLowerCase()}, avocado and tomato.`,0],
    [`Sprinkle ${q('seed')} ${seedN} on top just before eating — adding them last preserves the omega-3s.`,0]];
  if(CK.milk)steps.push([`Pour an 8 oz glass of milk on the side for calcium and vitamin D.`,0]);
  const t=nutMeal({kind:'bowl',servings:1,protein:p,milk:CK.milk}).t;
  openModal(`<div class="ckh"><h3 style="margin:0;font-size:15px">Complete Balanced Bowl</h3><button class="btn" data-act="close">Close</button></div>
    <div class="ckh"><div><div class="lbl" style="margin-bottom:6px">Servings</div><div class="step"><button data-act="cks" data-v="-1">−</button><b>${s}</b><button data-act="cks" data-v="1">+</button></div></div>
    <div><div class="lbl" style="margin-bottom:6px">Protein ${p===todayPlan()?'<span class="grn">(today\'s plan)</span>':''}</div><div class="chips">${PKEYS.map(k=>`<button class="chip${k===p?' on':''}" data-act="ckp" data-v="${k}">${PROT[k].n}</button>`).join('')}</div></div>
    <div><div class="lbl" style="margin-bottom:6px">Side</div><button class="chip${CK.milk?' on':''}" data-act="ckm">Glass of milk</button></div></div>
    <div class="ns"><div>Per bowl<b>${fi(t.kcal)} kcal</b></div><div>Protein<b>${fi(t.p)} g</b></div><div>Carbs<b>${fi(t.c)} g</b></div><div>Fat<b>${fi(t.f)} g</b></div><div>Fiber<b>${fi(t.fib)} g</b></div><div>EPA+DHA<b class="${t.epa>=.5?'grn':''}">${fi(t.epa*1000)} mg</b></div></div>
    <div class="sec">INGREDIENTS · ${s} SERVING${s>1?'S':''}</div>
    <div class="ing">${ings.map(x=>`<label><input type="checkbox"><span>${x}</span></label>`).join('')}</div>
    <div class="sec">STEPS</div>
    ${steps.map(([txt,sec],i)=>`<div class="stp"><b>${i+1}</b><div>${txt}</div>${sec?`<button class="tmr" data-act="tmr" data-v="${i}|${sec}" data-tmr="${i}">${CT[i]?'⏱ '+mmss((CT[i].end-Date.now())/1000):'⏱ '+mmss(sec)}</button>`:''}</div>`).join('')}
    <div class="tip"><b>Rotation tip:</b> 2–3× a week swap eggs for salmon or sardines for EPA/DHA. Chicken and steak add protein, iron and zinc but almost no omega-3. Rice &amp; beans keep 4–5 days in the fridge.</div>
    <div class="mact"><div class="sp"></div><button class="btn go" data-act="cklog">Log my bowl (${PROT[p].n}${CK.milk?' + milk':''})</button></div>`,true);
}
setInterval(()=>{for(const i in CT){const b=document.querySelector(`[data-tmr="${i}"]`),left=(CT[i].end-Date.now())/1000;
  if(left<=0){delete CT[i];beep();navigator.vibrate?.([200,100,200]);toast(`Step ${+i+1} timer done`);if(b)b.textContent='✓ Done';continue}
  if(b)b.textContent='⏱ '+mmss(left)}},500);

  const riceDry=settings.riceAs==='cooked'?b('rice')/3:b('rice'),beans=b('beans'),spin=b('spinach'),garl=b('garlic'),milk=n;
  const L=[`Grocery list · ${nd} day${nd>1?'s':''} · ${n} bowl${n>1?'s':''}`,'',

    `• Olive oil: ${fq(b('oil'))} tsp`,`• Salt & black pepper (pantry)`,'',

    `• Avocados: ${Math.ceil(b('avocado'))} — buy at mixed ripeness so they don't all ripen at once`,

    `• Tomatoes: ${Math.ceil(b('tomato'))}`,`• Limes: ${Math.ceil(b('lime'))}`,`• Garlic: ${Math.ceil(garl)} cloves (~${Math.max(1,Math.ceil(garl/10))} head${Math.ceil(garl/10)>1?'s':''})`,'',

  if(pc.chicken)L.push(`• Chicken breast: ${pc.chicken} meal${pc.chicken>1?'s':''} → ~${raw(pc.chicken*settings.portion)} oz raw (${lb(raw(pc.chicken*settings.portion))} lb)`);
  if(pc.steak)L.push(`• Steak: ${pc.steak} meal${pc.steak>1?'s':''} → ~${raw(pc.steak*settings.portion)} oz raw (${lb(raw(pc.steak*settings.portion))} lb)`);
  L.push(`• Milk (${settings.milk==='2'?'2%':settings.milk}): ${milk} cups → ${milk<=8?'½ gallon':`${Math.ceil(milk/8)/2} gallon${milk>16?'s':''}`}`);
  L.push('','Raw weights assume ~25% cooking loss.');
  return L.join('\n');
}

/* ---------- csv ---------- */
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importFile(file){
  const rows=parseCSV(await file.text());if(rows.length<2)return toast('CSV is empty');
  const H=rows[0].map(h=>h.replace(/^\ufeff/,'').trim().toLowerCase()),ix=k=>H.indexOf(k);
  if(ix('time')<0||ix('kind')<0)return toast('Unrecognized CSV format');
  const v=(r,k)=>ix(k)>=0?(r[ix(k)]??'').trim():'',n=(r,k)=>+v(r,k)||0,out=[];
  for(const r of rows.slice(1)){const d=new Date(v(r,'time'));if(isNaN(d))continue;
    if(v(r,'kind')==='bowl')out.push({id:uid(),time:d.toISOString(),kind:'bowl',servings:n(r,'servings')||1,protein:PROT[v(r,'protein')]?v(r,'protein'):'egg',milk:v(r,'milk')==='true',omit:v(r,'omit')?v(r,'omit').split('|'):[],note:v(r,'note')});
    else out.push({id:uid(),time:d.toISOString(),kind:'quick',name:v(r,'name')||'Food',kcal:n(r,'kcal'),p:n(r,'protein_g'),c:n(r,'carbs_g'),f:n(r,'fat_g'),fib:n(r,'fiber_g'),note:v(r,'note')})}
  const key=m=>[m.time,m.kind,m.protein||m.name].join('|'),have=new Set(meals.map(key)),addl=out.filter(m=>!have.has(key(m)));
  meals.push(...addl);save();render();toast(`Imported ${addl.length} meal${addl.length===1?'':'s'}`);
}
function exportCSV(){
  const f=filtered().sort((a,b)=>new Date(a.time)-new Date(b.time)),q=s=>/[",\n]/.test(s=String(s??''))?`"${s.replace(/"/g,'""')}"`:s;
  const csv=['time,kind,name,servings,protein,milk,omit,kcal,protein_g,carbs_g,fat_g,fiber_g,epa_dha_mg,note',...f.map(m=>{const t=NM(m).t;
    return[m.time,m.kind,m.kind==='bowl'?'Bowl':m.name,m.servings??'',m.protein??'',m.milk??'',(m.omit||[]).join('|'),Math.round(t.kcal||0),r1(t.p||0),r1(t.c||0),r1(t.f||0),r1(t.fib||0),Math.round((t.epa||0)*1000),m.note].map(q).join(',')})].join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`meals-${ymd(new Date())}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- demo ---------- */
function demoData(){
  let sd=5;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
  const snacks=[['Greek yogurt',150,15,8,4,0],['Apple',95,.5,25,.3,4.4],['Protein shake',160,30,5,2,1],['Almonds (1 oz)',164,6,6,14,3.5],['Banana',105,1.3,27,.4,3.1]];
  for(let k=35;k>=1;k--){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-k);if(rnd()<.1)continue;
    const plan=settings.plan[(d.getDay()+6)%7],prot=rnd()<.2?PKEYS[Math.floor(rnd()*PKEYS.length)]:plan;
    const at=new Date(d);at.setHours(12,15+Math.floor(rnd()*40));
    meals.push({id:uid(),time:at.toISOString(),kind:'bowl',servings:1,protein:prot,milk:rnd()<.85,omit:rnd()<.1?['avocado']:[],note:''});
    if(rnd()<.35){const ev=new Date(d);ev.setHours(19,0);meals.push({id:uid(),time:ev.toISOString(),kind:'bowl',servings:1,protein:'egg',milk:rnd()<.5,omit:[],note:''})}
    const sn=Math.floor(rnd()*3);for(let i=0;i<sn;i++){const[s,kc,p,c,f,fib]=snacks[Math.floor(rnd()*snacks.length)],t=new Date(d);t.setHours(15+i*3,0);meals.push({id:uid(),time:t.toISOString(),kind:'quick',name:s,kcal:kc,p,c,f,fib,note:''})}
  }
  if(!settings.batch)settings.batch={date:addDays(today(),-2),made:5};
}

/* ---------- events ---------- */
$('#fKind').onchange=e=>{S.kind=e.target.value;S.page=1;render()};
$('#fRange').onchange=e=>{S.range=e.target.value;S.sel=null;S.page=1;render()};
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='rowsSel'){S.rows=+e.target.value;S.page=1;render()}
  if(id==='pgIn'){S.page=+e.target.value||1;render()}
  if(id==='q_name'){const l=meals.filter(m=>m.kind==='quick'&&m.name.toLowerCase()===e.target.value.trim().toLowerCase()).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];
    if(l)['kcal','p','c','f','fib'].forEach(k=>$('#q_'+k).value=l[k]??'')}
});
document.addEventListener('input',e=>{if(e.target.id==='g_days'||e.target.id==='g_per'){const nd=Math.max(1,Math.min(28,+$('#g_days').value||7)),per=Math.max(1,Math.min(4,+$('#g_per').value||1));$('#g_out').textContent=groceryText(nd,per)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{
  if(e.target.id==='modal')return closeModal();
  const day=e.target.closest('[data-day]');
  if(day){S.sel=S.sel===day.dataset.day?null:day.dataset.day;S.page=1;render();return}
  const b=e.target.closest('[data-act]');if(!b)return;const id=b.dataset.id,v=b.dataset.v;
  const A={
    mprev:()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);render()},
    mnext:()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);render()},
    mtoday:()=>{const t=new Date();S.month=new Date(t.getFullYear(),t.getMonth(),1);S.sel=null;render()},
    pprev:()=>{S.page--;render()},pnext:()=>{S.page++;render()},
    cook:()=>cookMode(),addbowl:()=>bowlForm(),quick:()=>quickForm(),info:()=>info(id),
    edit:()=>{const m=meals.find(x=>x.id===id);m?.kind==='bowl'?bowlForm(m):quickForm(m)},
    savebowl:()=>saveBowl(id),savequick:()=>saveQuick(id),close:closeModal,export:exportCSV,data:dataForm,grocery:()=>groceryForm(),batch:batchForm,
    del:()=>{if(confirm('Delete this entry?')){meals=meals.filter(x=>x.id!==id);save();closeModal();render()}},
    cycle:()=>{const i=+v;settings.plan[i]=PKEYS[(PKEYS.indexOf(settings.plan[i])+1)%PKEYS.length];save();render()},
    cks:()=>{CK.s=Math.max(1,Math.min(12,CK.s+ +v));drawCook()},ckp:()=>{CK.protein=v;drawCook()},ckm:()=>{CK.milk=!CK.milk;drawCook()},
    cklog:()=>{upsert({id:uid(),time:new Date().toISOString(),kind:'bowl',servings:1,protein:CK.protein,milk:CK.milk,omit:[],note:''});closeModal();toast('Bowl logged')},
    tmr:()=>{const[i,sec]=v.split('|').map(Number);if(CT[i]){delete CT[i];b.textContent='⏱ '+mmss(sec)}else{beep();CT[i]={end:Date.now()+sec*1000}}},
    gcopy:async()=>{const t=$('#g_out').textContent;try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);toast('Copied to clipboard')}}catch{}},
    savebatch:()=>{const d=$('#b_date').value;if(!d)return toast('Pick a date');settings.batch={date:d,made:Math.max(1,+$('#b_made').value||5)};save();closeModal();render()},
    clearbatch:()=>{settings.batch=null;save();closeModal();render()},
    savedata:async()=>{Object.assign(settings,{kcal:Math.max(800,+$('#s_kcal').value||2000),protein:Math.max(20,+$('#s_protein').value||100),riceAs:$('#s_rice').value,seed:$('#s_seed').value,
      milk:$('#s_milk').value,portion:Math.max(2,+$('#s_portion').value||4.5),fishTarget:Math.max(0,+$('#s_fish').value||0)});save();
      const file=$('#i_file').files[0];closeModal();if(file)await importFile(file);else render()},
    demo:()=>{demoData();save();closeModal();S.range='7d';S.sel=null;render();toast('Demo data loaded')},
    clear:()=>{if(confirm('Delete ALL meals and the batch record? Export a CSV first if you want a backup.')){meals=[];settings.batch=null;save();closeModal();render()}}
  };
  A[b.dataset.act]?.();
});

render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
