<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NUTRITION">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>ISIONXXX // NUTRITION</title>
<link rel="stylesheet" href="ui.css">
<style>
:root{
  color-scheme:dark;
  --bg:#070707;--card:#0c0c0c;--cell:#0a0a0a;--line:#1c1c1c;--line2:#2c2c2c;
  --tx:#d9d5c8;--mu:#8f8a7e;--acc:#ffb000;--amber:#ffb000;
  --g:#33ff66;--r:#ff4545;--a:#ff7a33;--b:#7f9cb0;--blue:#ffb000;
  --f:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{margin:0 auto;max-width:1440px;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(48px + env(safe-area-inset-bottom));background:var(--bg);color:var(--tx);font:13px/1.45 var(--f);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:1px solid var(--acc);outline-offset:1px}
::selection{background:var(--acc);color:#000}
.red{color:var(--r)}.grn{color:var(--g)}.amb{color:var(--acc)}.mu{color:var(--mu)}.mu2{color:var(--mu)}
.hidden{display:none!important}

/* header + filter bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:15px;letter-spacing:.14em}
.brand b{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.05em;margin-left:6px;background:var(--acc);vertical-align:-2px;animation:bl 1.1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0}
.sel{background:var(--bg);border:1px solid var(--line2);border-radius:0;padding:7px 10px;min-width:150px}
.sel:hover{border-color:var(--acc);color:var(--acc)}
.ctx{color:var(--mu)}
.sp{flex:1}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--bg);border-radius:0;padding:7px 10px;display:inline-flex;gap:6px;align-items:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn svg{width:14px;height:14px}
.btn.pri,.btn.go{background:var(--acc);border-color:var(--acc);color:#000;font-weight:600}
.btn.pri:hover,.btn.go:hover{color:#000;filter:brightness(1.12)}
.btn.dng{color:var(--r)}.btn.dng:hover{border-color:var(--r)}

/* layout + cards */
.grid{display:grid;gap:12px;margin-bottom:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.gm{grid-template-columns:2fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.ban{flex-direction:row;align-items:center;justify-content:space-between;gap:16px;padding:16px;margin-bottom:12px;flex-wrap:wrap;border-color:var(--acc)}
.bd{padding:16px;flex:1;display:flex;flex-direction:column}
.ft{border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;font-size:11px;color:var(--mu);gap:10px;flex-wrap:wrap;align-items:center}
.card h3{font-size:11px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:12px}
.card h3::before{content:'> ';color:var(--mu)}
.lbl{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.big{font-size:22px;font-weight:600;margin:2px 0 8px}
.gauge{display:block;width:150px;max-width:100%;margin:6px auto 10px}
.gauge path{fill:none;stroke-width:9}
.gauge text{fill:var(--tx);font:600 17px var(--f)}
.lr{display:grid;grid-template-columns:14px 1fr auto 46px;align-items:center;padding:2px 0}
.lr span{min-width:0}.lr b{text-align:right}.lr em{font-style:normal;text-align:right;color:var(--mu)}
.dot{width:7px;height:7px;margin-right:7px;display:inline-block;flex:none}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0}
.hb{height:20px;background:#111;margin:2px 0 10px;overflow:hidden}
.hb i{display:block;height:100%}

/* rotation plan */
.pdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pday{background:var(--cell);border:1px solid var(--line);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pday.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.pdn{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.pp{border:1px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);padding:3px 6px;font-size:10px;letter-spacing:.04em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pst{font-size:10px;min-height:12px;display:flex;gap:3px;align-items:center}.pst i{width:7px;height:7px;display:inline-block}

/* calendar */
.calhd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.wl{color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:12px}
.dh{text-align:center;font-size:11px;color:var(--mu);padding:4px 0;letter-spacing:.08em;text-transform:uppercase}
.cell{min-height:66px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--mu);cursor:pointer;position:relative;overflow:hidden}
.cell.hatch{background:repeating-linear-gradient(135deg,#0a0a0a 0 6px,#111 6px 7px)}
.cell.out{cursor:default;border-color:transparent;opacity:.5}
.cell.fut span{color:#827d72}
.cell.on{border-color:rgba(255,176,0,.3)}
.cell.on.ok{background:rgba(51,255,102,.10);border-color:rgba(51,255,102,.35)}.cell.on.ok b{color:var(--g)}
.cell.on.over{background:rgba(255,69,69,.10);border-color:rgba(255,69,69,.4)}.cell.on.over b{color:#ff6b6b}
.cell.on.under{background:rgba(255,176,0,.06)}
.cell.on b{font-size:12px;color:var(--tx)}
.cell.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cell small{font-size:10px;color:var(--mu)}
.cell.wk{border:1px dashed var(--line2);background:#0a0a0a;color:var(--mu);cursor:default}
.cell.wk b{font-size:11px}
.cdots{display:flex;gap:2px}.cdots i{width:5px;height:5px}
.calft{padding:10px 16px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{border:1px solid var(--line2);min-width:33px;height:33px;padding:0 10px;font-size:12px}
.nav button:hover{border-color:var(--acc);color:var(--acc)}
.nav .tb{font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* coverage */
.ev h4{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;font-weight:400;margin:12px 0 4px;padding-top:12px;border-top:1px solid var(--line)}
.ev h4:first-of-type{border:0;padding-top:0;margin-top:0}
.er{display:flex;align-items:center;padding:5px 0;gap:2px}
.er span{flex:1}.er b{margin-right:8px;text-align:right;font-weight:600}
.q{width:12px;height:12px;border:1px solid var(--line2);font-size:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--mu);font-style:normal;flex:none;cursor:help}
hr{border:0;border-top:1px solid var(--line);margin:4px 0 8px}

/* charts */
.chart{width:100%;height:160px;display:block;margin-top:8px}
.chart *{vector-effect:non-scaling-stroke}
.empty{height:160px;display:grid;place-items:center;color:var(--mu);letter-spacing:.14em;font-size:11px;text-transform:uppercase;text-align:center}
.eqh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ks{display:flex;gap:22px;flex-wrap:wrap}
.ks div{font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase;display:flex;flex-direction:column;gap:2px}
.ks b{font-size:13px;color:var(--tx);letter-spacing:0;text-transform:none}
.radar{width:100%;max-width:230px;height:auto;margin:0 auto;display:block}
svg text{font-family:var(--f)}

/* table */
.tw{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.num{text-align:right}
.pill{display:inline-flex;padding:1px 6px;font-size:10px;border:1px solid;letter-spacing:.06em;text-transform:uppercase}
.acts{display:flex;gap:4px;justify-content:flex-end}
td .acts button{width:24px;height:24px;border:1px solid var(--line2);color:var(--tx);display:inline-flex;align-items:center;justify-content:center}
td .acts button:hover{border-color:var(--acc);color:var(--acc)}
.acts svg{width:13px;height:13px}
.th{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 4px}   /* title on the same line as every other card title */
.th h3{margin:0;flex:1}
/* pager: same as the other apps (MIND's .calf) */
.calf{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.card>.calf{margin:0;padding:12px 16px 16px}
.calf button{border:1px solid var(--line2);background:var(--bg);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.calf button:hover{border-color:var(--acc);color:var(--acc)}
.dim{color:var(--mu)}

/* modal (matches the dialogs in MIND / TRAINING) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;z-index:9;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
.box{background:var(--card);border:1px solid var(--acc);padding:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto}
.box.wide{max-width:760px}
.box h3{font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:14px}
.box p{margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mu);letter-spacing:.08em;text-transform:uppercase}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1px solid var(--line2);padding:7px 10px;width:100%;font-size:13px;letter-spacing:0;text-transform:none;color:var(--tx)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--acc);outline:0}
.ck{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--tx)}
.fg .ck label,.ck label{flex-direction:row;align-items:center;gap:6px;color:var(--tx);text-transform:none;letter-spacing:0;font-size:12px}
.ck input{width:auto;accent-color:var(--acc)}
.full{grid-column:1/-1}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.box .ui-set input,.box .ui-set select{flex:none;width:110px;background:var(--bg);border:1px solid var(--line2);padding:7px 10px;font-size:13px;color:var(--tx)}
.box .ui-set input:focus,.box .ui-set select:focus{border-color:var(--acc);outline:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.kv span{color:var(--mu)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;background:var(--card);border:1px solid var(--acc);color:var(--acc);padding:8px 14px;z-index:30}

/* cook mode */
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line2);padding:7px 10px;font-size:12px;letter-spacing:.06em}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#000}
.step{display:flex;align-items:center;gap:8px}.step button{width:30px;height:30px;border:1px solid var(--line2);font-size:15px}.step button:hover{border-color:var(--acc);color:var(--acc)}.step b{font-size:18px;min-width:26px;text-align:center}
.ckh{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.ckh h3{margin:0}
.sec{font-size:10px;letter-spacing:.16em;color:var(--mu);text-transform:uppercase;margin:12px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
.ing{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.ing label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}.ing input{accent-color:var(--g);margin-top:3px}
.ing input:checked+span{color:var(--mu);text-decoration:line-through}
.stp{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);line-height:1.5}
.stp>b{width:22px;height:22px;border:1px solid var(--acc);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px}
.stp>div{flex:1}
.tmr{border:1px solid var(--line2);padding:3px 8px;font-size:11px;white-space:nowrap;align-self:flex-start;letter-spacing:.06em}
.tmr:hover{border-color:var(--acc);color:var(--acc)}
.ns{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;background:var(--bg);border:1px solid var(--line);padding:10px 12px}.ns b{color:var(--tx);display:block;font-size:13px;letter-spacing:0;text-transform:none}
.tip{color:var(--mu);border:1px solid var(--line);border-left:2px solid var(--acc);padding:10px 12px;margin-top:14px;line-height:1.5}
pre.gl{white-space:pre-wrap;font:12px/1.6 var(--f);background:var(--bg);border:1px solid var(--line);padding:12px;margin-top:12px}
/* daily review: a script to read top to bottom */
.box.rvd{max-width:680px}
.rvh{display:flex;align-items:center;gap:8px;margin-bottom:6px}.rvh h3{margin:0;flex:1}
.rvh .btn{min-width:33px;justify-content:center}.rvh .btn:disabled{opacity:.35;cursor:default;border-color:var(--line2);color:inherit}
.rv{border-top:1px solid var(--line);padding:14px 0 4px;font-size:14px;line-height:1.7}
.rv h4{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.rv p{margin:0 0 8px}.rv b{font-weight:600}.rv q{color:var(--mu);font-style:italic}
.rv ol,.rv ul{margin:0 0 8px;padding-left:22px}.rv li{margin:0 0 6px}.rv li::marker{color:var(--mu)}
.rv .tr{display:block;color:var(--mu);font-size:12px}

@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.gm,.g3{grid-template-columns:1fr}}
@media(max-width:560px){
  body{padding-left:10px;padding-right:10px}
  .g4,.fg,.ing{grid-template-columns:1fr}
  .sel{min-width:0;flex:1}.ctx{width:100%}
  .cell{min-height:50px;padding:3px}.cell small{display:none}.cell b{font-size:10px}
  .pdays{grid-template-columns:repeat(4,1fr)}
  .fg input,.fg select,.fg textarea{font-size:16px}
}
/* ---------- cook mode as a session sheet (same as MIND / TRAINING / REWIRE sessions) ----------
   full screen on a phone, a centred sheet on wide screens, soft amber glow, slides up once, actions pinned to the bottom */
.modal:has(>.box.ss){padding:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.box.ss{max-width:none;width:100%;height:100%;max-height:none;border:0;padding:calc(env(safe-area-inset-top) + 18px) 20px 0;overscroll-behavior:contain;
  background:radial-gradient(90% 42% at 50% 18%,rgba(255,176,0,.06),transparent 72%),var(--bg);animation:ssIn .4s cubic-bezier(.2,.8,.2,1)}
.box.ss.ss-on{animation:none}
@keyframes ssIn{from{opacity:0;transform:translateY(32px)}}
.box.ss>*{max-width:560px;margin-left:auto;margin-right:auto}
.box.ss .ckh h3{font-size:11px!important;font-weight:600;letter-spacing:.22em;color:var(--mu)}
.box.ss .ckh>div{flex:1 1 100%}.box.ss .ckh .vl{margin-bottom:6px}
.box.ss .chip{transition:background-color .18s,border-color .18s,color .18s}
.box.ss .mact{position:sticky;bottom:0;z-index:2;margin:18px -20px 0;max-width:none;padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(rgba(7,7,7,0),var(--bg) 40%)}
.box.ss .mact .sp{display:none}.box.ss .mact .btn{flex:1;justify-content:center;padding:14px 8px}
@media(min-width:700px){.modal:has(>.box.ss){padding:24px}.box.ss{width:min(640px,100%);height:min(900px,100%);border:1px solid var(--line2)}}
@media(prefers-reduced-motion:reduce){.box.ss{animation:none}}
/* choices in a session read as a list, like the live workout's exercises: a dot (a box when you can pick several),
   the name, a detail on the right. Short sets of options are one segmented bar. */
.box.ss .vl{display:flex;flex-direction:column;gap:0;margin:6px 0 20px;border-top:1px solid var(--line)}
.box.ss .vl button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:13px;letter-spacing:0;color:var(--tx);transition:background-color .18s,color .18s}
.box.ss .vl button::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;border:1px solid var(--line2);transition:background-color .18s,border-color .18s,box-shadow .18s}
.box.ss .vl button.on{color:var(--amber);background:rgba(255,176,0,.06)}
.box.ss .vl button.on::before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 10px rgba(255,176,0,.6)}
.box.ss .vl.multi button::before{width:14px;height:14px;border-radius:2px;display:grid;place-items:center;font-size:10px;font-weight:600;line-height:1;color:#000}
.box.ss .vl.multi button.on::before{content:'✓';box-shadow:none}
.box.ss .vl button:hover{color:var(--amber)}
.box.ss .vl em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mu);text-align:right}
.box.ss .vl button.on em{color:var(--amber)}
.box.ss .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin:6px 0 20px;border:1px solid var(--line2)}
.box.ss .seg button{border:0;border-right:1px solid var(--line2);padding:11px 2px;text-align:center;background:none;font-size:12px;transition:background-color .18s,color .18s}
.box.ss .seg button:last-child{border-right:0}
.box.ss .seg button.on{background:var(--amber);color:#000}
/* cross-filters: anything with .pick narrows every card and the log; the filters show as chips under the bar */
.pick{cursor:pointer}.pick:focus-visible{outline:1px solid var(--acc);outline-offset:2px}
.lr.pick{margin:0 -6px;padding-left:6px;padding-right:6px}.lr.pick:hover{background:#121212}
.lr.on{background:#1a1406;box-shadow:inset 2px 0 0 var(--acc)}
.ks .pick:hover,.ks .pick.on,.ks .pick.on b,.wl .pick:hover{color:var(--acc)}.wl .pick{border-bottom:1px dotted var(--line2)}.wl .pick.on{color:var(--acc);border-color:var(--acc)}
.chart .off,.cell.off{opacity:.25}.chart .hit{fill:transparent}.chart .hit.pick:hover{fill:rgba(255,176,0,.08)}.chart .hit.on{fill:rgba(255,176,0,.12)}
.radar text.pick:hover,.radar text.on{fill:var(--acc)}.radar text.off{opacity:.4}
.xf{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 12px}
.xf span{color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
.xf button{border:1px solid var(--acc);color:var(--acc);padding:5px 8px;font-size:12px}.xf button b{font-weight:600}.xf .clr{border-color:var(--line2);color:var(--mu)}
h1.brand{margin:0}
.cell span{color:#a9a498}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">ISIONXXX <b>//</b> NUTRITION<i class="cur"></i></h1>
  <div class="acts" id="barBtns"></div>
</header>
<div id="top"></div>
<div class="bar">
  <select id="fKind" aria-label="Meal type" class="sel"><option value="all">All meals</option><option value="bowl">Bowls only</option><option value="quick">Other foods</option></select>
  <select id="fRange" aria-label="Date range" class="sel">
    <option value="today">Today</option><option value="week">This week</option><option value="month">This month</option><option value="all" selected>All time</option>

}

function smooth(pts){

// pick[i] = {f:'key:value', title}: the label becomes a cross-filter, bright when chosen, the others dim
function radar(labels,raw,pick=[]){

/* body weight from ISIONXXX's morning check-in (logged on TODAY; read-only here), next to what you ate:
   the weekly rate of change at your average intake, the way MacroFactor-style apps judge a calorie target */
function weightHTML(){
  let C=[];try{C=JSON.parse(localStorage.getItem('isx.checkin.v1'))?.log}catch(e){}
  if(!Array.isArray(C))return'';
  const U=(()=>{try{return JSON.parse(localStorage.getItem('isx.training.v1'))?.wu}catch(e){}})()||(/-US$/.test(navigator.language||'')?'lb':'kg');
  const W=C.filter(e=>e.w>0).sort((a,b)=>a.day<b.day?-1:1).map(e=>({d:e.day,w:!e.u||e.u===U?e.w:U==='kg'?e.w/2.20462:e.w*2.20462}));
  if(!W.length)return'';
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,t=today(),since=n=>addDays(t,-n);
  const w7=av(W.filter(x=>x.d>since(7)).map(x=>x.w)),p7=av(W.filter(x=>x.d<=since(7)&&x.d>since(14)).map(x=>x.w)),rate=w7!=null&&p7!=null?w7-p7:null;
  // average calories over the same two weeks, on days with meals logged
  const K={};meals.forEach(m=>{const d=dayOf(m);if(d>since(14)&&d<=t)K[d]=(K[d]||0)+(NM(m).t.kcal||0)});
  const kv=Object.values(K),k14=av(kv),last=W.at(-1),W30=W.filter(x=>x.d>since(30)).map(x=>x.w),lo=W30.length?Math.min(...W30)*.99:0;
  const say=rate==null?'Weigh in on TODAY for two weeks to see your trend.':Math.abs(rate)<(U==='kg'?.1:.2)?'Holding steady':`${rate<0?'Losing':'Gaining'} about ${fnum(r1(Math.abs(rate)))} ${U} / week`;
  return`<div class="grid gm">
  <div class="card"><div class="bd"><div class="eqh"><div><h3>Body weight</h3><div class="big" style="font-size:20px">${fnum(r1(last.w))} <span class="mu" style="font-size:12px;font-weight:500">${U} · ${fdate(last.d)}</span></div><div class="lbl" style="margin-top:4px">From your morning check-in · last 30 days</div></div>
    <div class="ks"><div>7-DAY AVG<b>${w7!=null?fnum(r1(w7)):'—'}</b></div><div>WEEK CHANGE<b class="${rate==null?'':rate<0?'grn':''}">${rate==null?'—':(rate>0?'+':'')+fnum(r1(rate))}</b></div><div>WEIGH-INS<b>${W30.length}</b></div></div></div>
    ${W30.length>1?area(W30.map(w=>r1(w-lo)),'#7f9cb0',0,(i0,i1)=>{const P=W.filter(x=>x.d>since(30)).slice(i0,i1);return{title:P.length>1?`${fmd(P[0].d)} – ${fmd(P.at(-1).d)}`:`${fmd(P[0].d)}: ${fnum(r1(P[0].w))} ${U}`}}):'<div class="empty">Add your weight at check-in on TODAY</div>'}</div></div>
  <div class="card"><div class="bd"><h3>Weight vs calories</h3><div class="lbl">Last 2 weeks</div><div class="big" style="font-size:20px">${say}</div>
    ${lr(ACC,'Average intake',k14!=null?`${fi(k14)} kcal`:'—')}${lr('#555','Your target',`${fi(settings.kcal)} kcal`)}${lr('var(--b)','Days with meals logged',`${kv.length} / 14`)}
    <div class="lbl" style="margin-top:10px">${rate==null||k14==null?'Needs two weeks of weigh-ins and logged meals.':Math.abs(rate)<(U==='kg'?.1:.2)?`About ${fi(k14)} kcal a day keeps you at this weight.`:`Each ${U==='kg'?'0.5 kg':'1 lb'} a week is roughly ${U==='kg'?'550':'500'} kcal a day ${rate<0?'below':'above'} what you burn.`}</div></div></div>
  </div>`;
}

function calendarHTML(){

    if(m.kind==='bowl'){o.dots.push(PROT[m.protein].col);if(PROT[m.protein].fish)o.fish++}else o.dots.push('#666')});

        <span>${d.getDate()}</span>${v?`<b>${fi(v.kcal)}</b><small>${fi(v.p)}g P</small><div class="cdots">${v.dots.slice(0,5).map(c=>`<i style="background:${c}"></i>`).join('')}</div>`:''}</div>`;

// daily totals for ISIONXXX's TODAY tab, which can't work out bowl nutrition itself.
// sig = size of the saved data, so TODAY can tell when this summary is out of date.
function publish(){
  try{
    const D={},from=addDays(today(),-13);
    meals.forEach(m=>{const d=dayOf(m);if(d<from)return;const t=NM(m).t,o=D[d]??={kcal:0,p:0,n:0};o.kcal+=t.kcal||0;o.p+=t.p||0;o.n++});
    const sig=(localStorage.getItem(K.m)||'').length+':'+(localStorage.getItem(K.s)||'').length;
    localStorage.setItem('nj.daily.v1',JSON.stringify({sig,kcal:settings.kcal,protein:settings.protein,days:D}));
    // every meal with its nutrients, for LEARN's lessons (which read the apps' logs); rewritten only when meals change
    if(JSON.parse(localStorage.getItem('nj.mealnut.v1')||'{}').sig!==sig)
      localStorage.setItem('nj.mealnut.v1',JSON.stringify({sig,meals:meals.map(m=>{const t=NM(m).t,r=v=>Math.round((v||0)*10)/10;
        return[m.id,m.time,m.kind,m.kind==='bowl'?(PROT[m.protein]?.n||'Bowl')+' bowl':m.name,r(t.kcal),r(t.p),r(t.c),r(t.f),r(t.fib)]})}));
  }catch(e){}
}

/* ---------- csv ---------- */
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()));
}
async function importFile(file){

  const H=rows[0].map(h=>h.replace(/^\ufeff/,'').trim().toLowerCase()),ix=k=>H.indexOf(k);
  if(ix('time')<0||ix('kind')<0)return toast('Unrecognized CSV format');
  const v=(r,k)=>ix(k)>=0?(r[ix(k)]??'').trim():'',n=(r,k)=>+v(r,k)||0,out=[];
  for(const r of rows.slice(1)){const d=new Date(v(r,'time'));if(isNaN(d))continue;
    if(v(r,'kind')==='bowl')out.push({id:uid(),time:d.toISOString(),kind:'bowl',servings:n(r,'servings')||1,protein:PROT[v(r,'protein')]?v(r,'protein'):'egg',milk:v(r,'milk')==='true',omit:v(r,'omit')?v(r,'omit').split('|'):[],note:v(r,'note')});
    else out.push({id:uid(),time:d.toISOString(),kind:'quick',name:v(r,'name')||'Food',kcal:n(r,'kcal'),p:n(r,'protein_g'),c:n(r,'carbs_g'),f:n(r,'fat_g'),fib:n(r,'fiber_g'),note:v(r,'note')})}
  const key=m=>[m.time,m.kind,m.protein||m.name].join('|'),have=new Set(meals.map(key)),addl=out.filter(m=>!have.has(key(m)));
  meals.push(...addl);save();render();toast(`Imported ${addl.length} meal${addl.length===1?'':'s'}`);
}
function exportCSV(){
  const f=view().sort((a,b)=>new Date(a.time)-new Date(b.time)),q=s=>/[",\n]/.test(s=String(s??''))?`"${s.replace(/"/g,'""')}"`:s;
  const csv=['time,kind,name,servings,protein,milk,omit,kcal,protein_g,carbs_g,fat_g,fiber_g,epa_dha_mg,note',...f.map(m=>{const t=NM(m).t;
    return[m.time,m.kind,m.kind==='bowl'?'Bowl':m.name,m.servings??'',m.protein??'',m.milk??'',(m.omit||[]).join('|'),Math.round(t.kcal||0),r1(t.p||0),r1(t.c||0),r1(t.f||0),r1(t.fib||0),Math.round((t.epa||0)*1000),m.note].map(q).join(',')})].join('\n');

}

function reviewForm(day){
  const D=rvDays();if(!D.length)return toast('No meals to review yet');
  day=D.includes(day)?day:rvDefault();const i=D.indexOf(day);
  openModal(`<div class="rvh"><h3>Daily review // ${pd(day).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</h3>
    <button class="btn" data-act="rvgo" data-v="${D[i-1]||''}" ${i>0?'':'disabled'} aria-label="Previous day with meals">&lt;</button><button class="btn" data-act="rvgo" data-v="${D[i+1]||''}" ${i<D.length-1?'':'disabled'} aria-label="Next day with meals">&gt;</button></div>
    <div id="rvb">${review(day)}</div>
    <div class="mact"><button class="btn" data-act="rvcopy">Copy</button><div class="sp"></div><button class="btn pri" data-act="close">Done</button></div>`);
  $('#mbox').classList.add('rvd');$('#mbox').scrollTop=0;
}
// plain text of the review, for pasting into a notes app
function reviewText(){
  const b=$('#rvb');if(!b)return '';
  return [$('.rvh h3').textContent.toUpperCase(),...[...b.querySelectorAll('.rv')].map(x=>[x.querySelector('h4').textContent.toUpperCase(),
    ...[...x.children].slice(1).map(el=>el.matches('ol,ul')?[...el.children].map((li,i)=>`${el.matches('ol')?i+1+'.':'-'} ${li.textContent.replace(/\s+/g,' ').trim()}`).join('\n'):el.textContent.replace(/\s+/g,' ').trim())].join('\n'))].join('\n\n');
}

/* ---------- demo ---------- */
function demoData(){
  let sd=5;const rnd=()=>(sd=sd*16807%2147483647)/2147483647;
  const snacks=[['Greek yogurt',150,15,8,4,0],['Apple',95,.5,25,.3,4.4],['Protein shake',160,30,5,2,1],['Almonds (1 oz)',164,6,6,14,3.5],['Banana',105,1.3,27,.4,3.1]];
  const now=new Date(),n0=meals.length;
  for(let k=35;k>=0;k--){
    const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-k);if(rnd()<.1&&k)continue;
    // two bowls a day: breakfast (eggs) or lunch, then dinner with the day's planned protein. Eggs are always the
    // morning bowl, so on an egg day dinner takes another protein
    const at=(h,m,span)=>{const t=new Date(d);t.setHours(h,m+Math.floor(rnd()*span));return t.toISOString()};
    const plan=settings.plan[(d.getDay()+6)%7],others=PKEYS.filter(p=>p!=='egg'),other=()=>others[Math.floor(rnd()*others.length)];
    const dinner=plan==='egg'?other():rnd()<.2?other():plan,morningEggs=plan==='egg'||rnd()<.6;
    const bowl=(time,protein)=>meals.push({id:uid(),time,kind:'bowl',servings:1,protein,milk:rnd()<.85,omit:rnd()<.1?['avocado']:[],note:''});
    bowl(morningEggs?at(7,0,90):at(12,15,45),morningEggs?'egg':other());
    bowl(at(18,30,60),dinner);
    const sn=Math.floor(rnd()*3);for(let i=0;i<sn;i++){const[s,kc,p,c,f,fib]=snacks[Math.floor(rnd()*snacks.length)],t=new Date(d);t.setHours(15+i*3,0);meals.push({id:uid(),time:t.toISOString(),kind:'quick',name:s,kcal:kc,p,c,f,fib,note:''})}
  }
  // the sample runs up to now: drop what today hasn't reached yet
  // (very early in the morning that's everything, so breakfast moves to just before now)
  const t0=new Date(now);t0.setHours(0,0,0,0);
  const fut=meals.slice(n0).filter(m=>new Date(m.time)>now),early=new Date(now-15*6e4);
  meals.splice(n0,meals.length,...meals.slice(n0).filter(m=>new Date(m.time)<=now));
  if(fut.length&&!meals.slice(n0).some(m=>new Date(m.time)>=t0)&&early>=t0)meals.push({...fut[0],time:early.toISOString()});
  if(!settings.batch)settings.batch={date:addDays(today(),-2),made:5};
  // two bowls a day come to ~2,450 kcal: if the target is still the untouched 2,000 default, set the one this plan is
  // built around, so the demo's calendar isn't all 'over'. A target you've set yourself is left alone
  if(settings.kcal===2000)settings.kcal=2500;
}

    clearbatch:()=>{settings.batch=null;save();closeModal();render()},

      milk:$('#s_milk').value,portion:Math.max(2,+$('#s_portion').value||4.5),fishTarget:Math.max(0,+$('#s_fish').value||0)});save();closeModal();render();toast('Settings saved')},
    icsv:()=>$('#i_file').click(),sync:()=>{closeModal();document.getElementById('isx-sync')?.click()},

  };

});

function doAct(a){if(!/^\w+$/.test(a||''))return;if(a==='today'){const t=new Date();S.x={};S.sel=today();S.month=new Date(t.getFullYear(),t.getMonth(),1);S.page=1;render();return}const b=document.querySelector(`[data-a="${a}"],[data-act="${a}"]`);if(b)b.click()}

{const m=/do=(\w+)/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>doAct(m[1]),0)}}
/* ---------- today at a glance (shared hero, timeline and motion from ui.js) ---------- */
function heroToday(){
  if(!meals.length)return '';
  const t=today(),T=meals.filter(m=>dayOf(m)===t).sort((a,b)=>Date.parse(a.time)-Date.parse(b.time));
  const sum=k=>T.reduce((a,m)=>a+(NM(m).t[k]||0),0),kc=sum('kcal'),p=sum('p'),fib=sum('fib'),left=settings.kcal-kc;
  // calories are 'done' on target (±10%), not for going over: past 110% the ring stays full but amber
  return UI.hero({key:'fuel',title:'Today',sub:T.length?`${T.length} meal${T.length>1?'s':''} · ${left>=0?fi(left)+' kcal left':fi(-left)+' kcal over'}`:'Nothing logged yet today',
    big:{value:fi(kc),label:`of ${fi(settings.kcal)} kcal`,tone:kc>settings.kcal*1.1?'neg':kc>=settings.kcal*.9?'pos':''},   // green on target (±10%) · red when well over
    rings:[{key:'kcal',label:'Calories',value:Math.round(kc),max:settings.kcal,display:`${fi(kc)}/${fi(settings.kcal)}`,done:kc>=settings.kcal*.9&&kc<=settings.kcal*1.1},{key:'p',label:'Protein',value:Math.round(p),max:settings.protein,display:`${fi(p)}/${fi(settings.protein)} g`},{key:'fib',label:'Fiber',value:Math.round(fib),max:28,display:`${fi(fib)}/28 g`}],
    action:{label:'+ Food',act:'quick'},
    log:T.map(m=>({at:Date.parse(m.time),tag:m.kind==='bowl'?'Bowl':'Food',text:`${m.kind==='bowl'?(PROT[m.protein]?.n||'Bowl')+(m.servings>1?' ×'+m.servings:''):m.name||'Food'} · ${fi(NM(m).t.kcal)} kcal · ${fi(NM(m).t.p)} g protein`}))});
}
