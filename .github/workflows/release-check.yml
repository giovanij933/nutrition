# Release check (ISIONXXX/test/README.md): this app and the TODAY shell in Chromium, on an empty device and with
# sample data, offline and with corrupted saved data, plus the shared files against the other six apps.
# Then this app and TODAY on an iPhone-sized screen in WebKit, Safari's engine (ISIONXXX/test/webkit.test.js).
# Any high-severity issue fails the run.
name: Release check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    # Playwright's own image, the same version as the one pinned in ISIONXXX/test/package.json (change both together):
    # Chromium, WebKit and the system packages they need are already in it, so a run installs nothing from Ubuntu's
    # package servers (when those were slow, installing them used up the whole time limit)
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          path: self
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the harness lives in the shell's repo (ISIONXXX/test): from a branch named like this one, else from main
      - name: Get the release check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          u=https://github.com/giovanij933/ISIONXXX
          git clone -q --depth 1 --branch "$BRANCH" "$u" harness 2>/dev/null || git clone -q --depth 1 "$u" harness
      - name: Release check
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash harness/test/ci.sh nutrition self
